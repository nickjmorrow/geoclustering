<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoclustering</title>
    <meta
      name="description"
      content="Group the places you want to visit into clusters you can see in a day, each with the shortest walk through it. Try a sample or upload your saved places from Google Maps."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c20" media="(prefers-color-scheme: dark)" />
    <!-- My own mark, the same icons nickjmorrow.com serves. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geoclustering" />
    <meta property="og:title" content="Geoclustering" />
    <meta
      property="og:description"
      content="Group the places you want to visit into clusters you can see in a day, each with the shortest walk through it."
    />
    <!-- Scrapers need absolute URLs, so these name the public demo; change
         them if you deploy somewhere else. -->
    <meta property="og:url" content="https://geoclustering.204-168-227-216.sslip.io/" />
    <meta property="og:image" content="https://geoclustering.204-168-227-216.sslip.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tokyo's saved places grouped into eight colored clusters on a map, each with its walking route."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Sets the theme before first paint. See public/theme.js for why it is a
         file and not an inline block. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
