server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No version in error pages or the Server header.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers, on every response from this server — and ONLY declared
    # here. nginx's `add_header` does not merge: a location with an
    # `add_header` of its own silently drops every one of these, which is why
    # /assets/ caches with `expires` instead.
    #
    # The CSP names the one outside origin the page talks to: OpenFreeMap,
    # for the basemap's style, tiles, fonts and sprites. `worker-src blob:` is
    # MapLibre's worker, which it starts from a blob URL that imports the
    # bundled worker file. Everything else is this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS belongs to whatever terminates TLS in front of this container.

    # Single-page app. `expires -1` so index.html is revalidated on every load
    # and never names a bundle a deploy has since replaced.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # The bundle calls /api on its own origin, exactly as in development where
    # Vite proxies it: one origin, no CORS, no API URL compiled in.
    location /api/ {
        # Through a variable, with Docker's embedded DNS, so `backend` is
        # re-resolved after the backend container is replaced rather than
        # pinned to the IP it had when nginx started.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are capped at 5 MB by the API; let a little over through so
        # the API, not nginx, says so — with a sentence instead of nginx's page.
        client_max_body_size 6m;
    }

    # The interactive API reference (Scalar) loads its script from a CDN and
    # runs inline code, which the app's CSP forbids. It gets its own, looser
    # policy — and because this block has an `add_header`, none of the ones
    # above apply here, so the rest are restated.
    location /api/docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed filenames, so these can never be stale.
    location /assets/ {
        expires 1y;
    }
}
